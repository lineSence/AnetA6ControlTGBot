# GitHub Actions workflow for this project.
#
# The token used to import the code could not write to .github/workflows/,
# so the workflow lives here. To enable CI, copy this file:
#
#   mkdir -p .github/workflows
#   git mv ci/ci.yml .github/workflows/ci.yml
#
name: tgbot-ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock

      # tests/test_converter.py loads the converter from the hard-coded install
      # path /root/gif2klipper.py (audit item T-3), so CI must provide it there
      # until that path becomes configurable.
      - name: Provide converter at legacy path
        run: |
          sudo cp gif2klipper.py /root/gif2klipper.py
          sudo chmod 755 /root
          sudo chmod 644 /root/gif2klipper.py

      # PYTHONPATH is required because the tests import the tgbot package from
      # the repository root (audit item T-2).
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
