# Example configuration for tg2printer 2.6.0 (config schema 6).
# Copy to /root/tgbot/config.yaml, chmod 600, and fill in the required values.
#
#   bot_token        - token from @BotFather (or set TG_BOT_TOKEN)
#   allowed_user_ids - Telegram user IDs allowed to control the printer
#
config_version: 6

bot_token: "PUT-YOUR-BOT-TOKEN-HERE"
allowed_user_ids: [123456789]
notify_chat: 123456789

# --- Moonraker ---
moonraker: "http://127.0.0.1:7125"
# API key of Moonraker. Leave empty when 127.0.0.1 is a trusted client.
# Can also be supplied through the MOONRAKER_API_KEY environment variable.
moonraker_api_key: ""
# Timeout of ordinary Moonraker calls, seconds.
http_timeout: 15
# Separate timeout for G-code uploads: large files need much more than 15 s.
upload_timeout: 300
camera_url: "http://127.0.0.1:8080/?action=snapshot"

# --- Paths ---
config_dir: "/root/printer_data/config"
converter: "/root/gif2klipper.py"
# Pillow lives only inside the bot virtualenv, so the converter must run with it.
python: "/opt/tgbot/bin/python"
max_glyphs: 250
preview_base: "/tmp/tg_preview"
backup_dir: "/root/tgbot/backups/animations"
error_db: "/root/tgbot/errors.db"

# --- Controls ---
xy_steps: [1, 5, 10, 50]
z_steps: [0.1, 0.5, 1, 5]
move_default: {xy: 10, z: 1}
fits: [contain, cover, stretch]
frames: [5, 10, 15, 20]

# --- Notifications ---
quiet_hours: {start: 23, end: 7}
# Failure alerts (Klipper shutdown, print error, lost connection) ignore quiet hours.
critical_alerts_ignore_quiet_hours: true
log_file: "/var/log/tg2printer.log"
log_level: "INFO"

# --- Safety ---
power_actions_require_confirmation: true
dangerous_macros_require_confirmation: true
# How long a confirmation button stays valid, seconds.
pending_ttl_seconds: 900
# How long an unfinished animation session is kept, seconds.
session_ttl_seconds: 3600

# --- Error log ---
# Number of records kept in errors.db; older rows are pruned automatically.
error_log_keep: 500
max_error_log_lines: 180

# --- Animations ---
animation_backup_keep: 5
animation_max_input_frames: 500
animation_max_input_pixels: 12000000
animation_max_duration_ms: 120000
animation_ffmpeg_timeout: 45
