# AnetA6ControlTGBot — пример конфигурации. Схема 7 (версия 2.7.0).
# Установщик копирует этот файл в /root/tgbot/config.yaml и подставляет токен и чат.
# Файл читается при старте. Незнакомые схемы обновляются автоматически (миграции).
config_version: 7

# --- Доступ ---------------------------------------------------------------
bot_token: ""            # токен от @BotFather; можно передать через TG_BOT_TOKEN
allowed_user_ids: []     # белый список Telegram id, например [123456789]
notify_chat: null        # куда шлём уведомления; по умолчанию первый id из списка

# --- Moonraker ------------------------------------------------------------
moonraker: "http://127.0.0.1:7125"
moonraker_api_key: ""    # можно передать через MOONRAKER_API_KEY
camera_url: "http://127.0.0.1:8080/?action=snapshot"
http_timeout: 15         # секунды на обычный запрос, минимум 5
upload_timeout: 300      # секунды на загрузку G-code, минимум 30

# --- Пути -----------------------------------------------------------------
config_dir: "/root/printer_data/config"
converter: "/root/gif2klipper.py"
python: "/opt/tgbot/bin/python"   # интерпретатор venv, в нём стоит Pillow
preview_base: "/tmp/tg_preview"
backup_dir: "/root/tgbot/backups/animations"
error_db: "/root/tgbot/errors.db"
log_file: "/var/log/tg2printer.log"
log_level: "INFO"

# --- Пульт движения -------------------------------------------------------
xy_steps: [1, 5, 10, 50]
z_steps: [0.1, 0.5, 1, 5]
move_default:
  xy: 10
  z: 1

# --- Анимации -------------------------------------------------------------
max_glyphs: 250
fits: ["contain", "cover", "stretch"]
frames: [5, 10, 15, 20]
animation_backup_keep: 5
animation_max_input_frames: 500
animation_max_input_pixels: 12000000
animation_max_duration_ms: 120000
animation_ffmpeg_timeout: 45

# --- Безопасность ---------------------------------------------------------
power_actions_require_confirmation: true
dangerous_macros_require_confirmation: true
pending_ttl_seconds: 900     # срок жизни подтверждения, минимум 60
session_ttl_seconds: 3600    # срок жизни сессии загрузки анимации, минимум 300

# --- Уведомления ----------------------------------------------------------
quiet_hours:
  start: 23
  end: 7
critical_alerts_ignore_quiet_hours: true

# --- Журнал ошибок --------------------------------------------------------
max_error_log_lines: 180
error_log_keep: 500

# --- UX (новое в схеме 7) -------------------------------------------------
antiflood_seconds: 0.8    # окно защиты от двойного нажатия; 0 выключает защиту
deny_notice_seconds: 300  # как часто напоминать чужому пользователю о запрете
progress_bar_width: 12    # ширина полосы прогресса, допустимо 4..20
